name: Build

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

env:
  ZIP_NAME: neverlose
  # Set under Settings -> Secrets and variables -> Actions -> Variables
  MARKETPLACE_ITEM_ID: ${{ vars.MARKETPLACE_ITEM_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build theme
        run: npm run build

      - name: Package theme
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="build-$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)"
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          # Theme files go at the archive root, the way the client unpacks them
          (cd dist && zip -r "../${ZIP_NAME}-${version}.zip" . -x '*.map')
          ls -lh "${ZIP_NAME}-${version}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}-${{ env.VERSION }}
          path: ${{ env.ZIP_NAME }}-${{ env.VERSION }}.zip

      - name: Attach archive to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${ZIP_NAME}-${VERSION}.zip" --clobber

      - name: Upload to LiquidBounce Marketplace
        if: github.event_name == 'release' && env.MARKETPLACE_ITEM_ID != '' && env.API_TOKEN != ''
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.liquidbounce.net/marketplace/items/${MARKETPLACE_ITEM_ID}/revisions"
          curl -fsS -X POST "${api}" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -F "file=@${ZIP_NAME}-${VERSION}.zip" \
            -F "version=${VERSION}" \
            -F "changelog=$(git log -1 --format=%s)" \
            -F "sourceRepository=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -F "sourceRef=${GITHUB_REF_NAME}" \
            -F "sourceCommit=${GITHUB_SHA}" \
            -F "sourceBuildUrl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            | jq '{id, version, status}'
