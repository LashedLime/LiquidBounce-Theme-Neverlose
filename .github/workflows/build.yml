name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  ZIP_NAME: neverbounce
  MARKETPLACE_ITEM_ID: '913'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build theme
        run: npm run build

      - name: Package theme
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="build-$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)"
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          # Theme files go at the archive root, the way the client unpacks them
          (cd dist && zip -r "../${ZIP_NAME}-${version}.zip" . -x '*.map')
          ls -lh "${ZIP_NAME}-${version}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}-${{ env.VERSION }}
          path: ${{ env.ZIP_NAME }}-${{ env.VERSION }}.zip

      - name: Publish GitHub release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${ZIP_NAME} ${VERSION}" \
              --notes "Automated build of ${GITHUB_REF_NAME} from ${GITHUB_SHA}"
          fi
          gh release upload "${GITHUB_REF_NAME}" "${ZIP_NAME}-${VERSION}.zip" --clobber

      - name: Upload to LiquidBounce Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          echo "Ref: ${GITHUB_REF} | Ref type: ${GITHUB_REF_TYPE} | Item ID: ${MARKETPLACE_ITEM_ID}"

          OIDC_TOKEN=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.liquidbounce.net" \
            | jq -r '.value')

          api="https://api.liquidbounce.net/marketplace/items/${MARKETPLACE_ITEM_ID}/revisions"
          response=$(curl -sS -w "\n%{http_code}" -X POST "${api}" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -F "file=@${ZIP_NAME}-${VERSION}.zip" \
            -F "version=${VERSION}" \
            -F "changelog=$(git log -1 --format=%s)" \
            -F "sourceRepository=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -F "sourceRef=${GITHUB_REF_NAME}" \
            -F "sourceCommit=${GITHUB_SHA}" \
            -F "sourceBuildUrl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")

          http_code=$(echo "${response}" | tail -n1)
          body=$(echo "${response}" | sed '$d')
          echo "HTTP ${http_code}: ${body}"

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            exit 1
          fi